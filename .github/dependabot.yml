# Weekly pull requests for outdated GitHub Actions and Go modules. CI tests
# each one before it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directories:
      - /daemon
      - /desktop
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
