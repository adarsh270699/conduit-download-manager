<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conduit setup</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/pages.css">
</head>
<body>
  <main class="setup-page">
    <header class="setup-brand">
      <svg class="brand-icon" viewBox="0 0 2048 2048" fill="none" aria-hidden="true">
        <path fill="var(--accent-primary, #F5C400)" d="M 654 408 V 840 C 654 986, 894 1134, 894 1280 V 1408 H 764 L 1024 1668 V 1280 C 1024 1160, 1175 1060, 1180 980 C 1185 930, 1190 890, 1190 840 V 408 H 1060 V 840 C 1060 920, 1024 970, 1024 1020 C 1024 970, 988 920, 988 840 V 408 H 858 V 840 C 858 890, 863 930, 868 1000 C 868 930, 784 890, 784 840 V 408 H 654 Z" />
        <path fill="var(--accent-secondary, #111111)" d="M 1264 408 H 1394 V 840 C 1394 986, 1154 1134, 1154 1280 V 1408 H 1284 L 1024 1668 V 1280 C 1024 1160, 1175 1060, 1180 980 C 1185 930, 1264 890, 1264 840 V 408 H 1264 Z" />
      </svg>
      <span class="brand-name">Conduit</span>
    </header>

    <section id="stepFolder" class="setup-card" aria-labelledby="folderTitle">
      <p class="setup-step">Step 1 of 2</p>
      <h1 id="folderTitle">Where should files go?</h1>
      <form id="folderForm" class="setup-form">
        <div class="form-group">
          <label for="downloadDir">Download folder</label>
          <input type="text" id="downloadDir" required placeholder="C:\Users\you\Downloads">
          <span class="form-hint">Completed files are saved here. You can change this later in Settings.</span>
        </div>
        <button class="btn btn-primary" type="submit">Continue</button>
      </form>
    </section>

    <section id="stepExtension" class="setup-card hidden" aria-labelledby="extensionTitle">
      <p class="setup-step">Step 2 of 2</p>
      <h1 id="extensionTitle" tabindex="-1">Catch downloads from the browser</h1>
      <p class="setup-copy">Conduit catches browser downloads only after you add the extension. Links you paste into Conduit work without it.</p>
      <div class="setup-actions">
        <button id="openGuideBtn" class="btn btn-primary" type="button">Open extension guide</button>
        <button id="skipBtn" class="btn btn-secondary" type="button">Skip for now</button>
      </div>
      <button id="continueBtn" class="btn btn-primary hidden setup-reveal" type="button">Continue to downloads</button>
    </section>

    <p id="setupError" class="setup-error" role="alert"></p>
  </main>
  <script src="/motion.js"></script>
  <script src="/setup.js"></script>
</body>
</html>
