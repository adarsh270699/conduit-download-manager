<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">
  <!-- Departures Board app icon, light: white tile, ink and signal yellow. Dark variant: favicon-dark.svg. -->
  <!-- Tile: #FFFFFF | Hairline: #CFCFC8 | Ink half: #111111 | Signal half: #F5C400 -->

  <!-- Tile with a hairline edge -->
  <rect id="tile" width="2048" height="2048" fill="#FFFFFF" stroke="#CFCFC8" stroke-width="2" />

  <!-- Converging-halves symbol -->
  <g id="conduit-symbol">
    <!-- Input channels and left accelerator half (ink) -->
    <path fill="#111111" d="M 654 408 V 840 C 654 986, 894 1134, 894 1280 V 1408 H 764 L 1024 1668 V 1280 C 1024 1160, 1175 1060, 1180 980 C 1185 930, 1190 890, 1190 840 V 408 H 1060 V 840 C 1060 920, 1024 970, 1024 1020 C 1024 970, 988 920, 988 840 V 408 H 858 V 840 C 858 890, 863 930, 868 1000 C 868 930, 784 890, 784 840 V 408 H 654 Z" />

    <!-- Output stream and right accelerator half (signal yellow) -->
    <path fill="#F5C400" d="M 1264 408 H 1394 V 840 C 1394 986, 1154 1134, 1154 1280 V 1408 H 1284 L 1024 1668 V 1280 C 1024 1160, 1175 1060, 1180 980 C 1185 930, 1264 890, 1264 840 V 408 H 1264 Z" />
  </g>
</svg>
